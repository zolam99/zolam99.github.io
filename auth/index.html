<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZolamAuth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  background:#050a06;
  font-family:'Segoe UI',Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}

body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
  pointer-events:none;z-index:2;
}

.grid-bg{
  position:fixed;inset:0;z-index:1;
  background-image:
    linear-gradient(rgba(0,255,100,0.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,100,0.015) 1px,transparent 1px);
  background-size:44px 44px;
  animation:gridDrift 28s linear infinite;
}
@keyframes gridDrift{to{background-position:44px 44px}}

.term-bg{
  position:fixed;inset:0;z-index:1;
  overflow:hidden;padding:12px 16px;
  font-size:9.5px;line-height:1.65;
  font-family:'Courier New',monospace;
  pointer-events:none;word-break:break-all;
  opacity:0;
  transition:opacity 1.2s ease;
}
.term-bg.visible{opacity:0.18;}

/* Ambient glow */
.ambient{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 60% 55% at 50% 50%, rgba(0,255,100,0.04) 0%, transparent 70%);
  animation:ambientPulse 4s ease-in-out infinite;
}
@keyframes ambientPulse{
  0%,100%{opacity:0.6;transform:scale(1)}
  50%{opacity:1;transform:scale(1.05)}
}

.wrap{
  position:relative;z-index:3;
  text-align:center;
  width:92%;max-width:380px;
  padding:48px 32px 40px;
  opacity:0;
  animation:wrapIn 0.8s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
}
@keyframes wrapIn{
  0%{opacity:0;transform:translateY(32px) scale(0.96)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* Ring system */
.ring-wrap{
  opacity:0;
  animation:scaleIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
  width:150px;height:150px;
  margin:0 auto 44px;
  position:relative;perspective:500px;
}
@keyframes scaleIn{
  0%{opacity:0;transform:scale(0.5) translateY(10px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

.ring1{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid transparent;
  border-top-color:#00ff64;
  border-right-color:rgba(0,255,100,0.15);
  animation:r1 2.2s cubic-bezier(0.4,0,0.6,1) infinite;
  transform-style:preserve-3d;
  filter:drop-shadow(0 0 10px rgba(0,255,100,0.75));
}
.ring2{
  position:absolute;inset:14px;border-radius:50%;
  border:1.5px solid transparent;
  border-bottom-color:rgba(0,255,100,0.55);
  border-left-color:rgba(0,255,100,0.12);
  animation:r2 1.6s cubic-bezier(0.4,0,0.6,1) infinite;
  transform-style:preserve-3d;
  filter:drop-shadow(0 0 6px rgba(0,255,100,0.4));
}
.ring3{
  position:absolute;inset:28px;border-radius:50%;
  border:1px solid transparent;
  border-top-color:rgba(0,255,100,0.22);
  border-right-color:rgba(0,255,100,0.08);
  animation:r3 3s cubic-bezier(0.4,0,0.6,1) infinite reverse;
}
.ring4{
  position:absolute;inset:5px;border-radius:50%;
  border:1px solid rgba(0,255,100,0.04);
  animation:breathe 3.5s ease-in-out infinite;
}

/* Pulse rings */
.pulse1,.pulse2{
  position:absolute;border-radius:50%;
  border:1px solid rgba(0,255,100,0.12);
  animation:pulseOut 3s ease-out infinite;
}
.pulse1{inset:-16px;}
.pulse2{inset:-32px;animation-delay:1.5s;border-color:rgba(0,255,100,0.06);}

@keyframes pulseOut{
  0%{transform:scale(0.9);opacity:0.8}
  70%{opacity:0}
  100%{transform:scale(1.1);opacity:0}
}
@keyframes r1{to{transform:rotateX(68deg) rotateZ(360deg)}}
@keyframes r2{to{transform:rotateX(68deg) rotateZ(360deg)}}
@keyframes r3{to{transform:rotateX(68deg) rotateZ(360deg)}}
@keyframes breathe{
  0%,100%{transform:scale(1);opacity:0.4}
  50%{transform:scale(1.08);opacity:0.9}
}

.ring-wrap::before{
  content:'';position:absolute;inset:16px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,255,100,0.08) 0%,transparent 68%);
  animation:breathe 3.5s ease-in-out infinite;
}

.icon-core{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}
.ic{
  width:34px;height:34px;fill:none;
  stroke:#00ff64;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;
  animation:iconPulse 2.8s ease-in-out infinite;
  transition:stroke 0.4s ease, opacity 0.3s ease;
}
@keyframes iconPulse{
  0%,100%{filter:drop-shadow(0 0 7px rgba(0,255,100,0.5));opacity:0.9}
  50%{filter:drop-shadow(0 0 18px rgba(0,255,100,0.9));opacity:1}
}

/* Title */
.title{
  opacity:0;
  animation:slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.45s forwards;
  font-size:26px;font-weight:800;
  margin-bottom:14px;letter-spacing:-0.4px;
  color:#00ff64;
  text-shadow:0 0 24px rgba(0,255,100,0.4),0 0 50px rgba(0,255,100,0.12);
  min-height:34px;
}
@keyframes glitch{
  0%,85%,100%{
    text-shadow:0 0 24px rgba(0,255,100,0.4),0 0 50px rgba(0,255,100,0.12);
    transform:translate(0);clip-path:none;
  }
  87%{
    text-shadow:-3px 0 rgba(0,200,255,0.7),3px 0 rgba(255,0,120,0.55);
    transform:translate(-2px,0);
  }
  89%{
    text-shadow:3px 0 rgba(0,200,255,0.7),-3px 0 rgba(255,0,120,0.55);
    transform:translate(2px,0);
  }
  91%{
    text-shadow:-1px 0 rgba(0,200,255,0.45),1px 0 rgba(255,0,120,0.35);
    transform:translate(-1px,0);
  }
  93%{
    text-shadow:0 0 24px rgba(0,255,100,0.4);
    transform:translate(0);
  }
}
.title.glitch-active{
  animation:slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.45s forwards,
             glitch 6s ease-in-out 2.5s infinite;
}

/* Subtitle */
.subtitle{
  opacity:0;
  animation:slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
  font-size:13px;color:rgba(255,255,255,0.28);
  margin-bottom:38px;line-height:2.1;font-weight:400;
  transition:opacity 0.5s ease;
}

/* Divider */
.divider{
  opacity:0;
  animation:fadeIn 0.6s ease 0.72s forwards;
  width:50px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,255,100,0.25),transparent);
  margin:0 auto 30px;
}
@keyframes fadeIn{to{opacity:1}}

/* Buttons */
.btn-wrap{
  opacity:0;
  animation:slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.78s forwards;
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
}

.btn{
  display:inline-flex;align-items:center;gap:9px;
  text-decoration:none;font-size:13px;font-weight:700;
  padding:13px 26px;border-radius:12px;
  color:#fff;letter-spacing:0.3px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform 0.3s cubic-bezier(0.16,1,0.3,1),
             box-shadow 0.3s cubic-bezier(0.16,1,0.3,1),
             filter 0.3s ease;
  will-change:transform;
}
.btn::before{
  content:'';position:absolute;
  top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.14),transparent);
  animation:shimmer 4s ease-in-out 2s infinite;
}
@keyframes shimmer{0%,100%{left:-120%}45%,55%{left:220%}}

.btn:hover{transform:translateY(-3px) scale(1.02)}
.btn:active{transform:translateY(1px) scale(0.98);transition-duration:0.1s;}

.btn-tg{
  background:linear-gradient(135deg,#0077b5 0%,#229ed9 100%);
  border:1px solid rgba(34,158,217,0.25);
  box-shadow:0 4px 18px rgba(34,158,217,0.2),inset 0 1px 0 rgba(255,255,255,0.07);
}
.btn-tg:hover{
  box-shadow:0 8px 30px rgba(34,158,217,0.38),inset 0 1px 0 rgba(255,255,255,0.1);
}

.btn-yt{
  background:linear-gradient(135deg,#b52222 0%,#e03c3c 100%);
  border:1px solid rgba(224,60,60,0.25);
  box-shadow:0 4px 18px rgba(224,60,60,0.18),inset 0 1px 0 rgba(255,255,255,0.07);
}
.btn-yt:hover{
  box-shadow:0 8px 30px rgba(224,60,60,0.35),inset 0 1px 0 rgba(255,255,255,0.1);
}

/* Ripple */
.ripple{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,0.2);
  transform:scale(0);
  animation:rippleAnim 0.6s cubic-bezier(0.16,1,0.3,1);
  pointer-events:none;
}
@keyframes rippleAnim{to{transform:scale(4.5);opacity:0}}

/* Footer */
.footer{
  opacity:0;
  animation:slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.95s forwards;
  margin-top:30px;
  font-size:9px;font-weight:700;
  color:rgba(0,255,100,0.22);
  letter-spacing:3.5px;
  font-family:'Courier New',monospace;
  padding-top:16px;
  border-top:1px solid rgba(0,255,100,0.06);
}

@keyframes slideUp{
  0%{opacity:0;transform:translateY(20px)}
  100%{opacity:1;transform:translateY(0)}
}

/* State transition overlay */
.ic-wrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 0.35s cubic-bezier(0.4,0,0.2,1),
             transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.ic-wrap.out{opacity:0;transform:scale(0.7) rotate(30deg);}
.ic-wrap.in{opacity:1;transform:scale(1) rotate(0deg);}
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="ambient"></div>
<div class="term-bg" id="termBg"></div>

<div class="wrap">
  <div class="ring-wrap">
    <div class="pulse2"></div>
    <div class="pulse1"></div>
    <div class="ring1"></div>
    <div class="ring2"></div>
    <div class="ring3"></div>
    <div class="ring4"></div>
    <div class="icon-core" id="iconCore">
      <div class="ic-wrap in" id="icWrap"></div>
    </div>
  </div>

  <div class="title" id="title"></div>
  <div class="subtitle" id="subtitle"></div>
  <div class="divider"></div>

  <div class="btn-wrap">
    <a class="btn btn-tg" href="https://t.me/freefilebd" target="_blank">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
      Telegram
    </a>
    <a class="btn btn-yt" href="https://youtube.com/@zolamff" target="_blank">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      YouTube
    </a>
  </div>

  <div class="footer">— PROTECTED BY ZOLAM AUTH —</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const s = params.get('s') || 'expired';

const iconSVGs = {
  wifi:`<svg class="ic" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>`,
  update:`<svg class="ic" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  lock:`<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
  key:`<svg class="ic" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>`,
  x:`<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
};

const cfg = {
  offline:      { icon:'wifi',   title:'Server Offline',  sub:'The server is currently offline.<br>Please try again later.' },
  network:      { icon:'wifi',   title:'Network Error',   sub:'Please check your internet<br>connection and try again.' },
  tokenexpired: { icon:'update', title:'Update Required', sub:'Server requires a bypass update.<br>Contact your admin to proceed.' },
  expired:      { icon:'lock',   title:'Access Expired',  sub:'Your access has expired.<br>Please contact admin to renew.' },
  notfound:     { icon:'key',    title:'Not Registered',  sub:'Your device is not registered.<br>Contact admin to get access.' },
  error:        { icon:'x',      title:'Auth Failed',     sub:'Failed to verify your device.<br>Please restart the game.' },
};

const c = cfg[s] || cfg.error;

// Set icon
document.getElementById('icWrap').innerHTML = iconSVGs[c.icon];

// Set subtitle
document.getElementById('subtitle').innerHTML = c.sub;

// Typewriter title
const titleEl = document.getElementById('title');
setTimeout(() => {
  let i = 0;
  const type = () => {
    if (i < c.title.length) {
      titleEl.textContent += c.title[i++];
      setTimeout(type, 52);
    } else {
      titleEl.classList.add('glitch-active');
    }
  };
  type();
}, 480);

// Ripple on buttons
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', function(e) {
    const r = document.createElement('span');
    r.classList.add('ripple');
    const rect = this.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size/2}px;top:${e.clientY - rect.top - size/2}px`;
    this.appendChild(r);
    setTimeout(() => r.remove(), 600);
  });
});

// Terminal bg — starts after page load
setTimeout(() => {
  document.getElementById('termBg').classList.add('visible');
}, 800);

const termEl = document.getElementById('termBg');
const termLines = [
  { t:'sys',  tx:'ZOLAM_AUTH v2.4.1 :: INITIALIZING...' },
  { t:'ok',   tx:'[SYS] Loading kernel modules... OK' },
  { t:'ok',   tx:'[NET] Establishing secure tunnel... DONE' },
  { t:'info', tx:'AUTH_CHECK :: device_id=0xA3F2C1D9B8E7' },
  { t:'info', tx:'[SCAN] Verifying token integrity...' },
  { t:'info', tx:'TOKEN_HASH: 8f3a2b1c9d4e5f6a7b8c9d0e' },
  { t:'warn', tx:'[WARN] Session expired :: ts=1728757200' },
  { t:'err',  tx:'STATUS :: ACCESS_DENIED' },
  { t:'err',  tx:'[ERR] 0x403 :: Unauthorized device' },
  { t:'err',  tx:'Checking bypass modules... FAILED' },
  { t:'info', tx:'[LOG] ip=192.168.1.x port=8443 proto=TLS' },
  { t:'info', tx:'ssl_cert: ZolamFF_ROOT_CA.pem :: valid' },
  { t:'warn', tx:'[NET] ping 10.0.0.1 ... timeout (3000ms)' },
  { t:'err',  tx:'reauth_attempt: 3/3 FAILED' },
  { t:'sys',  tx:'[SYS] Dumping stack trace...' },
  { t:'info', tx:'  at AuthModule.verify (auth.js:142:8)' },
  { t:'info', tx:'  at TokenValidator.check (token.js:88:4)' },
  { t:'info', tx:'  at Gateway.handle (gateway.js:56:12)' },
  { t:'warn', tx:'[DB] SELECT * FROM sessions WHERE uid=?' },
  { t:'err',  tx:'query_result: 0 rows :: session not found' },
  { t:'ok',   tx:'[CRYPT] AES-256-GCM init... OK' },
  { t:'err',  tx:'sig_verify: RSA-4096 MISMATCH :: invalid' },
  { t:'err',  tx:'[SEC] Firewall rule #44 TRIGGERED' },
  { t:'err',  tx:'BLOCK :: reason=expired_license :: code=403' },
  { t:'ok',   tx:'[MOD] ZolamFF protection layer ACTIVE' },
  { t:'info', tx:'channel: youtube.com/@zolamff' },
  { t:'info', tx:'support: t.me/freefilebd' },
  { t:'sys',  tx:'ZOLAM_AUTH :: session terminated. Goodbye.' },
  { t:'sys',  tx:'════════════════════════════════════════' },
];

const termColors = {
  sys:  'rgba(0,255,100,0.6)',
  ok:   'rgba(0,230,90,0.85)',
  info: 'rgba(0,190,75,0.45)',
  warn: 'rgba(255,210,0,0.72)',
  err:  'rgba(255,75,75,0.82)',
};

let content = '', lineIdx = 0, charIdx = 0;
function termTick() {
  if (lineIdx >= termLines.length) { lineIdx = 0; content = ''; charIdx = 0; }
  const line = termLines[lineIdx];
  const full = '> ' + line.tx;
  const col = termColors[line.t];
  if (charIdx <= full.length) {
    const partial = full.slice(0, charIdx) + (charIdx < full.length ? '█' : '');
    termEl.innerHTML = content + `<span style="color:${col}">${partial}</span>`;
    charIdx++;
  } else {
    content += `<span style="color:${col}">> ${line.tx}</span><br>`;
    lineIdx++; charIdx = 0;
    const brs = content.split('<br>');
    if (brs.length > 46) content = brs.slice(brs.length - 34).join('<br>') + '<br>';
  }
}
setInterval(termTick, 22);
</script>
</body>
</html>
