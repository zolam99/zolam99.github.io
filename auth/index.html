<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZolamAuth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  background:#050508;
  font-family:'Segoe UI',Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}

canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

/* Scanline overlay */
body::after{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
  pointer-events:none;z-index:2;
}

.card{
  position:relative;z-index:3;
  background:rgba(8,8,14,0.82);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  border:1px solid rgba(255,0,85,0.15);
  border-radius:20px;
  padding:48px 32px 36px;
  text-align:center;
  width:92%;max-width:360px;
  box-shadow:
    0 0 0 1px rgba(255,0,85,0.05),
    0 20px 60px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.04);
  animation:cardIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
  opacity:0;transform:translateY(24px) scale(0.97);
}

@keyframes cardIn{
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* 3D Ring */
.ring-wrap{
  width:100px;height:100px;
  margin:0 auto 28px;
  position:relative;
  perspective:300px;
}

.ring-outer{
  position:absolute;inset:0;
  border-radius:50%;
  border:2px solid transparent;
  border-top-color:var(--c,#ff0055);
  border-right-color:var(--c,#ff0055);
  animation:spin3d 2s linear infinite;
  transform-style:preserve-3d;
  filter:drop-shadow(0 0 6px var(--c,#ff0055));
}

.ring-mid{
  position:absolute;inset:10px;
  border-radius:50%;
  border:1.5px solid transparent;
  border-bottom-color:rgba(255,0,85,0.4);
  border-left-color:rgba(255,0,85,0.4);
  animation:spin3d 1.4s linear infinite reverse;
}

.ring-inner{
  position:absolute;inset:22px;
  border-radius:50%;
  border:1px solid rgba(255,0,85,0.2);
  animation:spin3d 3s linear infinite;
}

.icon-core{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}

@keyframes spin3d{
  0%{transform:rotateX(60deg) rotateZ(0deg)}
  100%{transform:rotateX(60deg) rotateZ(360deg)}
}

/* SVG Icons */
.ic{width:28px;height:28px;fill:none;stroke:var(--c,#ff0055);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:9px;font-weight:700;
  padding:4px 12px;border-radius:20px;
  margin-bottom:24px;letter-spacing:1.2px;text-transform:uppercase;
  background:rgba(255,0,85,0.06);
  color:rgba(255,0,85,0.7);
  border:1px solid rgba(255,0,85,0.15);
}

.badge::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--c,#ff0055);
  box-shadow:0 0 6px var(--c,#ff0055);
  animation:pulse 1.5s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.4;transform:scale(0.8)}
}

.title{
  font-size:20px;font-weight:800;
  margin-bottom:10px;
  letter-spacing:-0.5px;
  color:var(--c,#ff0055);
  text-shadow:0 0 20px rgba(255,0,85,0.4);
}

.subtitle{
  font-size:13px;color:rgba(255,255,255,0.38);
  margin-bottom:30px;line-height:1.8;
  font-weight:400;
}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  text-decoration:none;font-size:13px;font-weight:700;
  padding:12px 24px;border-radius:10px;
  color:#fff;letter-spacing:0.3px;
  background:linear-gradient(135deg,rgba(255,0,85,0.9),rgba(180,0,60,0.9));
  border:1px solid rgba(255,0,85,0.3);
  cursor:pointer;
  transition:all 0.2s;
  box-shadow:0 4px 20px rgba(255,0,85,0.25);
}

.btn:hover{
  box-shadow:0 4px 30px rgba(255,0,85,0.45);
  transform:translateY(-1px);
}

.divider{
  margin:24px 0 18px;
  border:none;border-top:1px solid rgba(255,255,255,0.04);
}

.footer{
  font-size:10px;color:rgba(255,255,255,0.12);
  letter-spacing:1.5px;font-weight:600;
}

/* Grid background */
.grid-bg{
  position:fixed;inset:0;z-index:1;
  background-image:
    linear-gradient(rgba(255,0,85,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,0,85,0.03) 1px,transparent 1px);
  background-size:40px 40px;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="grid-bg"></div>

<div class="card" id="card">
  <div class="badge" id="badge">ZolamAuth</div>

  <div class="ring-wrap">
    <div class="ring-outer" id="ringOuter"></div>
    <div class="ring-mid" id="ringMid"></div>
    <div class="ring-inner" id="ringInner"></div>
    <div class="icon-core" id="iconCore"></div>
  </div>

  <div class="title" id="title">Access Expired</div>
  <div class="subtitle" id="subtitle">Your access has expired.<br>Please contact admin to renew.</div>

  <a class="btn" id="btn" href="https://t.me/freefilebd">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
    Contact Admin
  </a>

  <hr class="divider">
  <div class="footer">PROTECTED BY ZOLAM AUTH</div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
const s=params.get('s')||'error';

// SVG icons
const icons={
  shield:`<svg class="ic" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  wifi:`<svg class="ic" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>`,
  update:`<svg class="ic" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  lock:`<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
  key:`<svg class="ic" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>`,
  x:`<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
};

const cfg={
  offline:     {icon:icons.wifi,   color:'#ff0055',title:'Server Offline',    sub:'The server is currently offline.<br>Please try again later.',      btn:'Try Again'},
  network:     {icon:icons.wifi,   color:'#ff0055',title:'Network Error',     sub:'Please check your internet<br>connection and try again.',           btn:'Retry'},
  tokenexpired:{icon:icons.update, color:'#ff0055',title:'Update Required',   sub:'Server requires a bypass update.<br>Contact your admin to proceed.',btn:'Contact Admin'},
  expired:     {icon:icons.lock,   color:'#ff0055',title:'Access Expired',    sub:'Your access has expired.<br>Please contact admin to renew.',        btn:'Contact Admin'},
  notfound:    {icon:icons.key,    color:'#ff0055',title:'Not Registered',    sub:'Your device is not registered.<br>Contact admin to get access.',    btn:'Get Access'},
  error:       {icon:icons.x,      color:'#ff0055',title:'Auth Failed',       sub:'Failed to verify your device.<br>Please restart the game.',         btn:'Contact Admin'},
};

const c=cfg[s]||cfg.error;

// Apply
document.documentElement.style.setProperty('--c',c.color);
document.querySelectorAll('.ring-outer,.ring-mid,.ring-inner,.ic,.badge,.title').forEach(el=>{
  el.style.setProperty('--c',c.color);
});
document.getElementById('iconCore').innerHTML=c.icon;
document.getElementById('title').textContent=c.title;
document.getElementById('subtitle').innerHTML=c.sub;
document.getElementById('btn').childNodes[1].textContent=' '+c.btn;

// Particle canvas
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,particles=[];

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);

function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)}}
const rgb=hexToRgb(c.color);

for(let i=0;i<50;i++){
  particles.push({
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight,
    r:Math.random()*1.2+0.2,
    vx:(Math.random()-0.5)*0.25,
    vy:(Math.random()-0.5)*0.25,
    a:Math.random()*0.35+0.05
  });
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // Vignette glow
  const grad=ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.4,W*0.65);
  grad.addColorStop(0,`rgba(${rgb.r},${rgb.g},${rgb.b},0.06)`);
  grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;
    if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(${rgb.r},${rgb.g},${rgb.b},${p.a})`;ctx.fill();
  });

  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<90){
        ctx.beginPath();
        ctx.moveTo(particles[i].x,particles[i].y);
        ctx.lineTo(particles[j].x,particles[j].y);
        ctx.strokeStyle=`rgba(${rgb.r},${rgb.g},${rgb.b},${0.06*(1-dist/90)})`;
        ctx.lineWidth=0.5;ctx.stroke();
      }
    }
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
