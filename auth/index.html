<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZolamAuth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:#0a0a0f;
  font-family:'Segoe UI',Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.card{
  position:relative;z-index:1;
  background:rgba(15,15,25,0.75);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;
  padding:52px 36px 40px;
  text-align:center;
  width:92%;max-width:360px;
}
.icon-wrap{
  width:80px;height:80px;border-radius:50%;
  margin:0 auto 24px;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;
  position:relative;
}
.icon-wrap::before{
  content:'';position:absolute;inset:-3px;
  border-radius:50%;
  background:conic-gradient(from 0deg,transparent 60%,var(--glow-color,#8b5cf6) 100%);
  animation:spin 3s linear infinite;
  z-index:-1;
}
.icon-wrap::after{
  content:'';position:absolute;inset:0;
  border-radius:50%;background:#0a0a0f;z-index:-1;
}
@keyframes spin{to{transform:rotate(360deg)}}
.title{
  font-size:22px;font-weight:700;
  margin-bottom:10px;
  letter-spacing:-0.3px;
}
.subtitle{
  font-size:13.5px;color:rgba(255,255,255,0.45);
  margin-bottom:32px;line-height:1.75;
}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  text-decoration:none;font-size:14px;font-weight:600;
  padding:13px 26px;border-radius:12px;
  color:#fff;
  background:linear-gradient(135deg,#5b21b6,#2563eb);
  border:none;cursor:pointer;
  transition:opacity 0.2s,transform 0.15s;
}
.btn:hover{opacity:0.88;transform:translateY(-1px)}
.divider{
  margin:28px 0 20px;
  border:none;border-top:1px solid rgba(255,255,255,0.06);
}
.footer{font-size:11px;color:rgba(255,255,255,0.2);letter-spacing:0.5px}
.badge{
  display:inline-block;
  font-size:10px;font-weight:600;
  padding:3px 10px;border-radius:20px;
  margin-bottom:20px;letter-spacing:0.8px;text-transform:uppercase;
  background:rgba(139,92,246,0.12);
  color:rgba(139,92,246,0.8);
  border:1px solid rgba(139,92,246,0.2);
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="card">
  <div class="badge">ZolamAuth</div>
  <div class="icon-wrap" id="iconWrap">
    <span id="icon">⛔</span>
  </div>
  <div class="title" id="title">Access Expired</div>
  <div class="subtitle" id="subtitle">Your access has expired.<br>Please contact admin to renew.</div>
  <a class="btn" href="https://t.me/freefilebd">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
    Join Telegram
  </a>
  <hr class="divider">
  <div class="footer">POWERED BY ZOLAMAUTH</div>
</div>
<script>
const params=new URLSearchParams(window.location.search);
const s=params.get('s')||'error';
const cfg={
  offline:     {icon:'🔴',color:'#ef4444',glow:'#ef4444',title:'Server Offline',sub:'The server is currently offline.<br>Please try again later.'},
  network:     {icon:'📡',color:'#f59e0b',glow:'#f59e0b',title:'Network Error',sub:'Please check your internet<br>connection and try again.'},
  tokenexpired:{icon:'⚠️',color:'#f59e0b',glow:'#f59e0b',title:'Update Required',sub:'A new version is available.<br>Please update to continue.'},
  expired:     {icon:'⛔',color:'#ef4444',glow:'#ef4444',title:'Access Expired',sub:'Your access has expired.<br>Please contact admin to renew.'},
  notfound:    {icon:'🔑',color:'#8b5cf6',glow:'#8b5cf6',title:'Device Not Registered',sub:'Your device is not registered.<br>Contact admin to get access.'},
  error:       {icon:'❌',color:'#ef4444',glow:'#ef4444',title:'Auth Error',sub:'Failed to verify your device.<br>Please restart the game.'},
};
const c=cfg[s]||cfg.error;
document.getElementById('icon').textContent=c.icon;
document.getElementById('title').textContent=c.title;
document.getElementById('title').style.color=c.color;
document.getElementById('subtitle').innerHTML=c.sub;
document.getElementById('iconWrap').style.setProperty('--glow-color',c.glow);

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,particles=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);
function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)}}
const rgb=hexToRgb(c.glow);
for(let i=0;i<60;i++){particles.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*1.5+0.3,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,a:Math.random()*0.5+0.1})}
function draw(){
  ctx.clearRect(0,0,W,H);
  const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.7);
  grad.addColorStop(0,'transparent');
  grad.addColorStop(1,`rgba(${rgb.r},${rgb.g},${rgb.b},0.04)`);
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;
    if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(${rgb.r},${rgb.g},${rgb.b},${p.a})`;ctx.fill();
  });
  for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<100){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(${rgb.r},${rgb.g},${rgb.b},${0.08*(1-dist/100)})`;ctx.lineWidth=0.5;ctx.stroke()}}}
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
