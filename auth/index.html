<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZolamAuth • Premium</title>
<style>
/* ── RESET ── */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}

body{
  background:#02020a;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  perspective:1400px;
  transform-style:preserve-3d;
  -webkit-font-smoothing:antialiased;
}

/* ── AMBIENT BACKGROUND GRADIENTS ── */
.ambient{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,0,85,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 15% 100%, rgba(120,0,255,0.14) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 100%, rgba(255,0,120,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 100% 100% at 50% 50%, #0a0410 0%, #02020a 70%);
  animation:ambientShift 14s ease-in-out infinite alternate;
}
@keyframes ambientShift{
  0%{filter:hue-rotate(0deg) brightness(1)}
  100%{filter:hue-rotate(15deg) brightness(1.15)}
}

/* ── CANVAS ── */
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* ── HOLOGRAPHIC GRID ── */
.grid-bg{
  position:fixed;inset:-10%;z-index:2;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,0,85,0.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,0,85,0.05) 1px,transparent 1px);
  background-size:70px 70px;
  animation:gridMove 30s linear infinite;
  transform:perspective(600px) rotateX(55deg) translateY(20%);
  transform-origin:center bottom;
  mask-image:radial-gradient(ellipse at 50% 30%, black 20%, transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%, black 20%, transparent 70%);
}
@keyframes gridMove{0%{background-position:0 0}100%{background-position:70px 70px}}

/* ── SCANLINES + VIGNETTE ── */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:30;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.12) 2px,rgba(0,0,0,0.12) 3px),
    radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.7) 100%);
  mix-blend-mode:multiply;
}

/* ── MAIN CARD ── */
.wrap{
  position:relative;z-index:20;
  width:94%;max-width:400px;
  padding:44px 26px 40px;
  border-radius:32px;
  text-align:center;
  background:
    linear-gradient(145deg,rgba(20,8,20,0.75) 0%,rgba(8,4,14,0.85) 100%);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(255,0,85,0.22);
  transform-style:preserve-3d;
  transform:rotateX(0deg) rotateY(0deg);
  animation:cardEnter 1.2s cubic-bezier(0.16,1,0.3,1) forwards,cardFloat 7s ease-in-out 1.2s infinite;
  opacity:0;
  box-shadow:
    0 40px 80px -30px rgba(0,0,0,0.9),
    0 0 0 1px rgba(255,255,255,0.04) inset,
    0 0 60px -10px rgba(255,0,85,0.4),
    0 0 120px -20px rgba(255,0,85,0.2);
}

/* animated top border glow */
.wrap::before{
  content:'';position:absolute;top:-1px;left:8%;right:8%;height:1.5px;
  background:linear-gradient(90deg,transparent,#ff0055,#ff4488,#ff0055,transparent);
  border-radius:2px;
  filter:blur(0.5px);
  animation:topGlow 3s ease-in-out infinite;
}
@keyframes topGlow{
  0%,100%{opacity:0.5;transform:scaleX(0.9)}
  50%{opacity:1;transform:scaleX(1)}
}

/* corner dots */
.wrap::after{
  content:'';position:absolute;inset:0;border-radius:32px;pointer-events:none;
  background:
    radial-gradient(circle at 12px 12px,rgba(255,0,85,0.6) 0 2px,transparent 3px),
    radial-gradient(circle at calc(100% - 12px) 12px,rgba(255,0,85,0.6) 0 2px,transparent 3px),
    radial-gradient(circle at 12px calc(100% - 12px),rgba(255,0,85,0.6) 0 2px,transparent 3px),
    radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),rgba(255,0,85,0.6) 0 2px,transparent 3px);
  animation:cornerPulse 3s ease-in-out infinite;
}
@keyframes cornerPulse{0%,100%{opacity:0.4}50%{opacity:1}}

@keyframes cardEnter{
  0%{opacity:0;transform:rotateX(-15deg) rotateY(8deg) translateY(50px) scale(0.85)}
  100%{opacity:1;transform:rotateX(0) rotateY(0) translateY(0) scale(1)}
}
@keyframes cardFloat{
  0%,100%{transform:translateY(0) rotateX(0deg) rotateY(0deg)}
  33%{transform:translateY(-5px) rotateX(1.5deg) rotateY(-2deg)}
  66%{transform:translateY(-3px) rotateX(-1deg) rotateY(2deg)}
}

/* ── 3D ICON STAGE ── */
.icon-stage{
  width:200px;height:200px;
  margin:0 auto 32px;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  transform-style:preserve-3d;
}

/* outer holographic disc */
.holo-disc{
  position:absolute;inset:-20px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,0,85,0.05),rgba(255,0,85,0.4),rgba(255,100,150,0.15),rgba(255,0,85,0.4),rgba(255,0,85,0.05));
  filter:blur(18px);
  animation:holoSpin 8s linear infinite;
  opacity:0.7;
}
@keyframes holoSpin{to{transform:rotate(360deg)}}

/* orbit rings */
.orbit{
  position:absolute;border-radius:50%;
  border:1.5px solid transparent;
  transform-style:preserve-3d;
  will-change:transform;
}
.orbit1{
  inset:0;
  border-top-color:#ff0055;
  border-right-color:rgba(255,0,85,0.3);
  box-shadow:0 0 15px rgba(255,0,85,0.6),inset 0 0 15px rgba(255,0,85,0.2);
  animation:orb1 3.6s linear infinite;
}
.orbit2{
  inset:16px;
  border-bottom-color:#ff4488;
  border-left-color:rgba(255,0,85,0.2);
  box-shadow:0 0 12px rgba(255,0,85,0.5),inset 0 0 12px rgba(255,0,85,0.15);
  animation:orb2 2.4s linear infinite;
}
.orbit3{
  inset:32px;
  border-top-color:rgba(255,120,160,0.8);
  border-right-color:rgba(255,0,85,0.2);
  box-shadow:0 0 10px rgba(255,0,85,0.4);
  animation:orb3 4.2s linear infinite reverse;
}
@keyframes orb1{
  0%{transform:rotateX(72deg) rotateZ(0)}
  100%{transform:rotateX(72deg) rotateZ(360deg)}
}
@keyframes orb2{
  0%{transform:rotateX(55deg) rotateY(25deg) rotateZ(0)}
  100%{transform:rotateX(55deg) rotateY(25deg) rotateZ(360deg)}
}
@keyframes orb3{
  0%{transform:rotateX(35deg) rotateY(-20deg) rotateZ(0)}
  100%{transform:rotateX(35deg) rotateY(-20deg) rotateZ(360deg)}
}

/* pulse rings */
.pulse-ring{
  position:absolute;border-radius:50%;
  border:1px solid rgba(255,0,85,0.2);
  animation:pulseRing 3s ease-out infinite;
}
.pulse-ring:nth-child(2){animation-delay:1s}
.pulse-ring:nth-child(3){animation-delay:2s}
@keyframes pulseRing{
  0%{inset:-10px;opacity:0.8;border-color:rgba(255,0,85,0.6)}
  100%{inset:-70px;opacity:0;border-color:rgba(255,0,85,0)}
}

/* center orb */
.center-orb{
  position:absolute;
  width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,
    rgba(255,255,255,0.25) 0%,
    rgba(255,0,85,0.4) 25%,
    rgba(255,0,85,0.15) 55%,
    transparent 75%);
  animation:orbBreath 3s ease-in-out infinite;
  filter:blur(2px);
}
@keyframes orbBreath{
  0%,100%{transform:scale(1);opacity:0.8}
  50%{transform:scale(1.25);opacity:1}
}

/* icon itself */
.ic-wrap{
  position:relative;z-index:6;
  display:flex;align-items:center;justify-content:center;
  animation:iconFloat 4s ease-in-out infinite;
  transform-style:preserve-3d;
}
@keyframes iconFloat{
  0%,100%{transform:translateY(0) rotateY(0deg)}
  50%{transform:translateY(-8px) rotateY(8deg)}
}
.ic{
  width:66px;height:66px;
  fill:none;stroke:#ff3366;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 12px #ff0055) drop-shadow(0 0 30px rgba(255,0,85,0.7)) drop-shadow(0 8px 20px rgba(0,0,0,0.8));
  animation:iconGlow 2.5s ease-in-out infinite;
}
@keyframes iconGlow{
  0%,100%{
    filter:drop-shadow(0 0 10px #ff0055) drop-shadow(0 0 24px rgba(255,0,85,0.5)) drop-shadow(0 8px 20px rgba(0,0,0,0.8));
    stroke:#ff3366;
  }
  50%{
    filter:drop-shadow(0 0 22px #ff4488) drop-shadow(0 0 50px rgba(255,0,85,0.9)) drop-shadow(0 12px 28px rgba(0,0,0,0.9));
    stroke:#ff5588;
  }
}
.ic path,.ic line,.ic polyline,.ic rect,.ic circle{
  stroke-dasharray:400;stroke-dashoffset:400;
  animation:draw 1.6s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
}
@keyframes draw{to{stroke-dashoffset:0}}

/* scan line */
.scan-sweep{
  position:absolute;inset:0;overflow:hidden;border-radius:50%;pointer-events:none;z-index:7;
}
.scan-sweep::after{
  content:'';position:absolute;left:-30%;right:-30%;height:2.5px;
  background:linear-gradient(90deg,transparent,#ff0055,#ff4488,#ff0055,transparent);
  border-radius:50%;
  box-shadow:0 0 20px #ff0055,0 0 40px rgba(255,0,85,0.6);
  animation:scanDown 3.5s ease-in-out 1s infinite;
}
@keyframes scanDown{
  0%{top:-3px;opacity:0}
  10%{opacity:1}
  90%{opacity:0.9}
  100%{top:200px;opacity:0}
}

/* corner brackets */
.corners{position:absolute;inset:0;pointer-events:none;z-index:8}
.corners span{
  position:absolute;width:18px;height:18px;
  border-color:rgba(255,0,85,0.7);border-style:solid;
  animation:cBlink 2.5s ease-in-out infinite;
  filter:drop-shadow(0 0 5px rgba(255,0,85,0.8));
}
.corners span:nth-child(1){top:8px;left:8px;border-width:2px 0 0 2px;border-radius:8px 0 0 0}
.corners span:nth-child(2){top:8px;right:8px;border-width:2px 2px 0 0;border-radius:0 8px 0 0;animation-delay:0.6s}
.corners span:nth-child(3){bottom:8px;left:8px;border-width:0 0 2px 2px;border-radius:0 0 0 8px;animation-delay:1.2s}
.corners span:nth-child(4){bottom:8px;right:8px;border-width:0 2px 2px 0;border-radius:0 0 8px 0;animation-delay:1.8s}
@keyframes cBlink{
  0%,100%{opacity:0.4;transform:scale(1)}
  50%{opacity:1;transform:scale(1.15)}
}

/* ── TITLE ── */
.title{
  font-size:32px;font-weight:800;
  letter-spacing:-0.8px;
  color:#ff3366;
  margin-bottom:14px;
  text-shadow:
    0 0 30px rgba(255,0,85,0.8),
    0 0 60px rgba(255,0,85,0.4),
    0 0 100px rgba(255,0,85,0.2),
    0 10px 20px rgba(0,0,0,0.7);
  opacity:0;
  animation:titleEnter 0.8s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
  transform-style:preserve-3d;
  position:relative;
}
.title.glitch{
  animation:titleEnter 0.8s cubic-bezier(0.16,1,0.3,1) 0.6s forwards,glitch 6s ease-in-out 2.5s infinite;
}
@keyframes titleEnter{
  0%{opacity:0;transform:translateY(24px) scale(0.9) rotateX(15deg)}
  100%{opacity:1;transform:translateY(0) scale(1) rotateX(0)}
}
@keyframes glitch{
  0%,88%,100%{
    text-shadow:0 0 30px rgba(255,0,85,0.8),0 0 60px rgba(255,0,85,0.4),0 10px 20px rgba(0,0,0,0.7);
    transform:translate(0) skewX(0deg);
  }
  90%{
    text-shadow:-3px 0 rgba(0,255,220,0.7),3px 0 rgba(255,0,85,0.9),0 0 30px rgba(255,0,85,0.8);
    transform:translate(-2px,1px) skewX(-2deg);
  }
  92%{
    text-shadow:3px 0 rgba(0,255,220,0.7),-3px 0 rgba(255,0,85,0.9),0 0 30px rgba(255,0,85,0.8);
    transform:translate(2px,-1px) skewX(2deg);
  }
  94%{
    text-shadow:0 0 30px rgba(255,0,85,0.8);
    transform:translate(0) skewX(0deg);
  }
}

/* ── SUBTITLE ── */
.subtitle{
  font-size:14px;
  color:rgba(255,255,255,0.5);
  margin-bottom:40px;
  line-height:1.9;
  letter-spacing:0.3px;
  opacity:0;
  animation:slideUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.8s forwards;
}
@keyframes slideUp{
  0%{opacity:0;transform:translateY(18px)}
  100%{opacity:1;transform:translateY(0)}
}

/* ── BUTTON ── */
.btn-wrap{
  opacity:0;
  animation:slideUp 0.7s cubic-bezier(0.16,1,0.3,1) 1s forwards;
  display:inline-block;
}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  text-decoration:none;
  font-size:14px;font-weight:700;
  padding:16px 38px;
  border-radius:14px;
  color:#fff;
  background:linear-gradient(135deg,#cc0044 0%,#ff0055 50%,#ff3377 100%);
  border:1px solid rgba(255,255,255,0.18);
  cursor:pointer;position:relative;overflow:hidden;
  transition:all 0.35s cubic-bezier(0.16,1,0.3,1);
  box-shadow:
    0 14px 32px -8px rgba(255,0,85,0.6),
    0 4px 12px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.2),
    inset 0 -3px 10px rgba(0,0,0,0.25);
  text-shadow:0 2px 6px rgba(0,0,0,0.4);
  letter-spacing:0.4px;
}
.btn::before{
  content:'';position:absolute;top:0;left:-150%;width:70%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
  transform:skewX(-20deg);
  animation:shimmer 4s ease-in-out 3s infinite;
}
@keyframes shimmer{0%{left:-150%}100%{left:220%}}
.btn::after{
  content:'';position:absolute;inset:-2px;border-radius:16px;
  background:linear-gradient(135deg,rgba(255,0,85,0.5),transparent,rgba(255,0,85,0.5));
  opacity:0;transition:opacity 0.3s;z-index:-1;filter:blur(8px);
}
.btn:hover{
  box-shadow:
    0 22px 45px -8px rgba(255,0,85,0.8),
    0 8px 20px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.25),
    inset 0 -3px 10px rgba(0,0,0,0.2);
  transform:translateY(-3px) scale(1.03);
}
.btn:hover::after{opacity:1}
.btn:active{
  transform:translateY(0) scale(0.98);
  box-shadow:0 8px 20px rgba(255,0,85,0.5),inset 0 4px 14px rgba(0,0,0,0.4);
}
.btn svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4))}
.ripple{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.5),rgba(255,255,255,0.1) 70%,transparent);
  transform:scale(0);
  animation:rippleAnim 0.8s cubic-bezier(0.16,1,0.3,1);
  pointer-events:none;
}
@keyframes rippleAnim{to{transform:scale(5);opacity:0}}

/* ── FOOTER ── */
.footer{
  margin-top:36px;
  font-size:9.5px;
  color:rgba(255,0,85,0.28);
  letter-spacing:3.5px;
  font-weight:700;
  text-transform:uppercase;
  opacity:0;
  animation:slideUp 0.7s cubic-bezier(0.16,1,0.3,1) 1.15s forwards;
  position:relative;
}
.footer::before,
.footer::after{
  content:'';position:absolute;top:50%;width:24px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,0,85,0.4));
}
.footer::before{left:calc(50% - 90px)}
.footer::after{right:calc(50% - 90px);background:linear-gradient(90deg,rgba(255,0,85,0.4),transparent)}

/* ── RESPONSIVE ── */
@media (max-width:420px){
  .wrap{padding:36px 20px 32px;border-radius:28px}
  .icon-stage{width:170px;height:170px;margin-bottom:26px}
  .ic{width:56px;height:56px}
  .title{font-size:27px}
  .subtitle{font-size:13px;margin-bottom:34px}
  .btn{padding:15px 30px;font-size:13px}
  .footer::before,.footer::after{width:18px}
  .footer::before{left:calc(50% - 78px)}
  .footer::after{right:calc(50% - 78px)}
}
</style>
</head>
<body>
<div class="ambient"></div>
<canvas id="c"></canvas>
<div class="grid-bg"></div>

<div class="wrap">
  <div class="icon-stage">
    <div class="holo-disc"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="orbit orbit1"></div>
    <div class="orbit orbit2"></div>
    <div class="orbit orbit3"></div>
    <div class="center-orb"></div>
    <div class="scan-sweep"></div>
    <div class="corners"><span></span><span></span><span></span><span></span></div>
    <div class="ic-wrap" id="iconWrap"></div>
  </div>

  <div class="title glitch" id="title">Auth Failed</div>
  <div class="subtitle" id="subtitle">Failed to verify your device.<br>Please restart the game.</div>

  <div class="btn-wrap">
    <a class="btn" id="btn" href="https://t.me/freefilebd">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="white"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
      <span id="btnText">Contact Admin</span>
    </a>
  </div>
  <div class="footer">Protected by Zolam Auth</div>
</div>

<script>
const icons = {
  shield:`<svg class="ic" viewBox="0 0 24 24"><path d="M12 2L3 6v6c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V6L12 2z"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="1.2" fill="#ff0055" stroke="none"/></svg>`,
  wifi:`<svg class="ic" viewBox="0 0 24 24"><path d="M1 6C4.67 2.33 9.1 0 12 0s7.33 2.33 11 6"/><path d="M4 10c2.18-2.18 5.06-3.5 8-3.5s5.82 1.32 8 3.5"/><path d="M7.5 14c1.27-1.27 2.95-2 4.5-2s3.23.73 4.5 2"/><line x1="2" y1="2" x2="22" y2="22"/><circle cx="12" cy="19" r="1.2" fill="#ff0055" stroke="none"/></svg>`,
  update:`<svg class="ic" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>`,
  lock:`<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1.2" fill="#ff0055" stroke="none"/></svg>`,
  key:`<svg class="ic" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5L17 9l2.5-2.5L18 5"/></svg>`,
  x:`<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>`,
  ban:`<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>`,
};
const cfg = {
  offline:      {icon:icons.wifi,   title:'Server Offline',  sub:'The server is currently offline.<br>Please try again later.',       btn:'Try Again'},
  network:      {icon:icons.wifi,   title:'Network Error',   sub:'Please check your internet<br>connection and try again.',            btn:'Retry'},
  tokenexpired: {icon:icons.update, title:'Update Required', sub:'Server requires a bypass update.<br>Contact your admin to proceed.', btn:'Contact Admin'},
  expired:      {icon:icons.lock,   title:'Access Expired',  sub:'Your access has expired.<br>Please contact admin to renew.',         btn:'Contact Admin'},
  notfound:     {icon:icons.key,    title:'Not Registered',  sub:'Your device is not registered.<br>Contact admin to get access.',     btn:'Get Access'},
  error:        {icon:icons.x,      title:'Auth Failed',     sub:'Failed to verify your device.<br>Please restart the game.',          btn:'Contact Admin'},
  banned:       {icon:icons.ban,    title:'Device Banned',   sub:'Your device has been banned.<br>Contact admin for more info.',       btn:'Contact Admin'},
};

const params = new URLSearchParams(window.location.search);
const s = params.get('s') || 'error';
const c = cfg[s] || cfg.error;

document.getElementById('iconWrap').innerHTML = c.icon;
document.getElementById('title').textContent = c.title;
document.getElementById('subtitle').innerHTML = c.sub;
document.getElementById('btnText').textContent = c.btn;

const titleEl = document.getElementById('title');
const origText = c.title;
setTimeout(()=>{
  titleEl.textContent='';
  let i=0;
  const type=()=>{if(i<origText.length){titleEl.textContent+=origText[i++];setTimeout(type,70);}};
  type();
},650);

document.getElementById('btn').addEventListener('click',function(e){
  const r=document.createElement('span');
  r.classList.add('ripple');
  const rect=this.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height);
  r.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
  this.appendChild(r);
  setTimeout(()=>r.remove(),800);
});

/* ── CANVAS – immersive 3D depth ── */
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
let mouse={x:-9999,y:-9999};
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener('touchmove',e=>{mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY;},{passive:true});

/* particle field – 3 depth layers */
const layers=[];
for(let L=0;L<3;L++){
  const pts=[];
  const count=L===0?50:L===1?40:25;
  const speed=L===0?0.3:L===1?0.5:0.8;
  const size=L===0?0.8:L===1?1.2:1.8;
  const alpha=L===0?0.15:L===1?0.25:0.4;
  for(let i=0;i<count;i++){
    pts.push({
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      r:Math.random()*size+0.3,
      vx:(Math.random()-0.5)*speed,
      vy:(Math.random()-0.5)*speed,
      a:alpha*(0.6+Math.random()*0.4),
      z:L
    });
  }
  layers.push(pts);
}

/* energy rings */
const rings=[];
function spawnRing(){rings.push({r:0,maxR:Math.min(W||400,H||700)*0.65,a:0.6,w:1.5});}
spawnRing();
setInterval(spawnRing,2600);

/* comets */
const comets=[];
function spawnComet(){
  const angle=(Math.random()*70-35)*Math.PI/180;
  comets.push({
    x:-100,
    y:Math.random()*(H||700)*0.8,
    vx:Math.cos(angle)*(10+Math.random()*8),
    vy:Math.sin(angle)*(4+Math.random()*4),
    len:150+Math.random()*150,
    a:0.9,
    life:1,
    hue:Math.random()>0.7?320:340
  });
}
setInterval(()=>{if(Math.random()<0.6)spawnComet();},1400);

/* floating orbs */
const orbs=[];
for(let i=0;i<6;i++){
  orbs.push({
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight,
    r:40+Math.random()*80,
    vx:(Math.random()-0.5)*0.15,
    vy:(Math.random()-0.5)*0.15,
    a:0.04+Math.random()*0.06,
    hue:340+Math.random()*30
  });
}

function loop(){
  ctx.clearRect(0,0,W,H);

  /* ambient floating orbs */
  orbs.forEach(o=>{
    o.x+=o.vx;o.y+=o.vy;
    if(o.x<-o.r)o.x=W+o.r;if(o.x>W+o.r)o.x=-o.r;
    if(o.y<-o.r)o.y=H+o.r;if(o.y>H+o.r)o.y=-o.r;
    const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
    g.addColorStop(0,`hsla(${o.hue},100%,60%,${o.a})`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;
    ctx.fillRect(o.x-o.r,o.y-o.r,o.r*2,o.r*2);
  });

  /* center glow */
  const cg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.6);
  cg.addColorStop(0,'rgba(255,0,85,0.09)');
  cg.addColorStop(0.4,'rgba(255,0,85,0.03)');
  cg.addColorStop(1,'transparent');
  ctx.fillStyle=cg;
  ctx.fillRect(0,0,W,H);

  /* energy rings */
  for(let i=rings.length-1;i>=0;i--){
    const rg=rings[i];
    rg.r+=2.2;
    rg.a-=0.5/(rg.maxR/2.2);
    if(rg.a<=0){rings.splice(i,1);continue;}
    ctx.beginPath();
    ctx.arc(W/2,H/2,rg.r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,0,85,${rg.a*0.35})`;
    ctx.lineWidth=rg.w*rg.a*2;
    ctx.shadowColor='rgba(255,0,85,0.5)';
    ctx.shadowBlur=25;
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  /* comets */
  for(let i=comets.length-1;i>=0;i--){
    const cm=comets[i];
    cm.x+=cm.vx;cm.y+=cm.vy;
    cm.life-=0.008;
    if(cm.life<=0||cm.x>W+200||cm.y>H+200){comets.splice(i,1);continue;}
    const tx=cm.x-cm.vx*(cm.len/Math.max(Math.abs(cm.vx),1));
    const ty=cm.y-cm.vy*(cm.len/Math.max(Math.abs(cm.vx),1));
    const gr=ctx.createLinearGradient(cm.x,cm.y,tx,ty);
    gr.addColorStop(0,`hsla(${cm.hue},100%,70%,${cm.a*cm.life})`);
    gr.addColorStop(0.3,`hsla(${cm.hue},100%,55%,${cm.a*cm.life*0.6})`);
    gr.addColorStop(1,`hsla(${cm.hue},100%,50%,0)`);
    ctx.beginPath();
    ctx.moveTo(cm.x,cm.y);ctx.lineTo(tx,ty);
    ctx.strokeStyle=gr;
    ctx.lineWidth=2.5*cm.life;
    ctx.shadowColor=`hsla(${cm.hue},100%,60%,0.8)`;
    ctx.shadowBlur=20;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cm.x,cm.y,2.5*cm.life,0,Math.PI*2);
    ctx.fillStyle=`hsla(${cm.hue},100%,85%,${cm.life})`;
    ctx.shadowBlur=35;
    ctx.fill();
    ctx.shadowBlur=0;
  }

  /* particles – 3 depth layers with mouse parallax */
  layers.forEach((pts,z)=>{
    pts.forEach(p=>{
      const dx=p.x-mouse.x;
      const dy=p.y-mouse.y;
      const d=Math.sqrt(dx*dx+dy*dy);
      const influence=(z+1)*60;
      if(d<influence&&d>0){
        const f=(influence-d)/influence;
        p.x+=(dx/d)*f*(z+1)*1.5;
        p.y+=(dy/d)*f*(z+1)*1.5;
      }
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*(1+z*0.3),0,Math.PI*2);
      ctx.fillStyle=`rgba(255,${60+z*40},${120+z*30},${p.a})`;
      ctx.shadowColor=`rgba(255,0,85,${p.a*0.8})`;
      ctx.shadowBlur=z===2?15:8;
      ctx.fill();
      ctx.shadowBlur=0;
    });
  });

  /* connections – only for layer 2 (deepest) */
  const deep=layers[2];
  for(let i=0;i<deep.length;i++){
    for(let j=i+1;j<deep.length;j++){
      const dx=deep[i].x-deep[j].x,dy=deep[i].y-deep[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<130){
        ctx.beginPath();
        ctx.moveTo(deep[i].x,deep[i].y);
        ctx.lineTo(deep[j].x,deep[j].y);
        ctx.strokeStyle=`rgba(255,0,85,${0.12*(1-d/130)})`;
        ctx.lineWidth=0.5;
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
