<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZolamAuth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f0f;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 48px 36px;
    text-align: center;
    width: 90%;
    max-width: 360px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .icon { font-size: 60px; margin-bottom: 20px; }
  .title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 32px;
    line-height: 1.7;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #229ED9;
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 10px;
  }
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #333;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">⏳</div>
  <div class="title" id="title" style="color:#888">Loading...</div>
  <div class="subtitle" id="subtitle"></div>
  <a class="btn" href="https://t.me/freefilebd">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
    Join Telegram
  </a>
  <div class="footer">Powered by ZolamAuth</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const s = params.get('s') || 'error';

  const config = {
    offline:      { icon: '🔴', color: '#ef4444', title: 'Server Offline',         sub: 'The server is currently offline. Please try again later.' },
    network:      { icon: '📡', color: '#f59e0b', title: 'Network Error',           sub: 'Please check your internet connection and try again.' },
    tokenexpired: { icon: '⚠️', color: '#f59e0b', title: 'Update Required',         sub: 'A new version is available. Please update to continue.' },
    expired:      { icon: '⛔', color: '#ef4444', title: 'Access Expired',          sub: 'Your access has expired. Please contact admin to renew.' },
    notfound:     { icon: '🔑', color: '#f59e0b', title: 'Device Not Registered',   sub: 'Your device is not registered. Contact admin to get access.' },
    error:        { icon: '❌', color: '#ef4444', title: 'Auth Error',              sub: 'Failed to verify your device. Please restart the game.' },
  };

  const c = config[s] || config.error;
  document.getElementById('icon').textContent     = c.icon;
  document.getElementById('title').textContent    = c.title;
  document.getElementById('title').style.color    = c.color;
  document.getElementById('subtitle').textContent = c.sub;
</script>
</body>
</html>
