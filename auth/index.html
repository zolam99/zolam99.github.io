<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZolamAuth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000000;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;}
body{display:flex;align-items:center;justify-content:center;position:relative;}

#particles{position:fixed;inset:0;z-index:0;pointer-events:none;will-change:transform;}


.ambient{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 45% at 50% 44%,rgba(0,255,100,0.06) 0%,transparent 65%);
  animation:ambPulse 5s ease-in-out infinite;
}
@keyframes ambPulse{0%,100%{opacity:0.7}50%{opacity:1}}

.wrap{
  position:relative;z-index:3;text-align:center;
  width:88%;max-width:360px;padding:0 24px;
  display:flex;flex-direction:column;align-items:center;
  opacity:0;animation:wrapIn 0.8s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
}
@keyframes wrapIn{from{opacity:0;transform:translateY(30px) scale(0.95)}to{opacity:1;transform:none}}

.ring-wrap{
  width:168px;height:168px;margin-bottom:38px;
  position:relative;flex-shrink:0;
  opacity:0;animation:ringIn 1s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
}
@keyframes ringIn{from{opacity:0;transform:scale(0.4)}to{opacity:1;transform:scale(1)}}

.pr{
  position:absolute;border-radius:50%;border:1px solid rgba(0,255,100,0.2);
  top:50%;left:50%;transform:translate(-50%,-50%);
}
.pr1{width:100%;height:100%;animation:prOut 2.8s ease-out infinite;}
.pr2{width:130%;height:130%;border-color:rgba(0,255,100,0.09);animation:prOut 2.8s ease-out 1.4s infinite;}
.pr3{width:160%;height:160%;border-color:rgba(0,255,100,0.04);animation:prOut 2.8s ease-out 0.7s infinite;}
@keyframes prOut{
  0%{transform:translate(-50%,-50%) scale(0.82);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.1);opacity:0}
}

.arc{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;will-change:transform;}

.arc1{
  border-top-color:#00ff64;
  border-right-color:rgba(0,255,100,0.08);
  animation:spin1 1.6s linear infinite, flicker1 4s ease-in-out infinite;
  filter:drop-shadow(0 0 8px #00ff64) drop-shadow(0 0 16px rgba(0,255,100,0.4));
}
@keyframes flicker1{
  0%,100%{filter:drop-shadow(0 0 8px #00ff64) drop-shadow(0 0 16px rgba(0,255,100,0.4));opacity:1}
  18%{filter:drop-shadow(0 0 3px #00ff64);opacity:0.6}
  20%{filter:drop-shadow(0 0 14px #00ff64) drop-shadow(0 0 28px rgba(0,255,100,0.6));opacity:1}
  55%{filter:drop-shadow(0 0 10px #00ff64) drop-shadow(0 0 20px rgba(0,255,100,0.5));opacity:1}
  57%{filter:drop-shadow(0 0 2px #00ff64);opacity:0.5}
  59%{filter:drop-shadow(0 0 12px #00ff64) drop-shadow(0 0 24px rgba(0,255,100,0.55));opacity:1}
}
.arc2{
  inset:15px;
  border-bottom-color:rgba(0,255,100,0.65);
  border-left-color:rgba(0,255,100,0.08);
  animation:spin2 1.1s linear infinite, flicker2 6s ease-in-out 1s infinite;
  filter:drop-shadow(0 0 5px rgba(0,255,100,0.55));
}
@keyframes flicker2{
  0%,100%{filter:drop-shadow(0 0 5px rgba(0,255,100,0.55));opacity:1}
  40%{filter:drop-shadow(0 0 1px rgba(0,255,100,0.3));opacity:0.55}
  42%{filter:drop-shadow(0 0 8px rgba(0,255,100,0.7));opacity:1}
}
.arc3{
  inset:30px;
  border-right-color:rgba(0,255,100,0.3);
  border-bottom-color:rgba(0,255,100,0.08);
  animation:spin3 2.4s linear infinite reverse;
  filter:drop-shadow(0 0 3px rgba(0,255,100,0.3));
}
.arc4{
  inset:6px;border-color:rgba(0,255,100,0.03);
  animation:breathe 4s ease-in-out infinite;
}
.arc-dash{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px dashed rgba(0,255,100,0.0);
  animation:dashAppear 3.5s ease-in-out infinite;
}
@keyframes dashAppear{
  0%,40%,100%{border-color:rgba(0,255,100,0.0);transform:rotate(0deg)}
  45%{border-color:rgba(0,255,100,0.35);transform:rotate(15deg)}
  50%{border-color:rgba(0,255,100,0.55);transform:rotate(25deg)}
  55%{border-color:rgba(0,255,100,0.3);transform:rotate(40deg)}
  60%{border-color:rgba(0,255,100,0.0);transform:rotate(55deg)}
}
@keyframes spin1{to{transform:rotate(360deg)}}
@keyframes spin2{to{transform:rotate(360deg)}}
@keyframes spin3{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:0.4}50%{transform:scale(1.08);opacity:0.9}}

.glow-disc{
  position:absolute;top:50%;left:50%;
  width:55%;height:55%;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(0,255,100,0.12) 0%,rgba(0,255,100,0.04) 50%,transparent 70%);
  animation:glowDisc 3.5s ease-in-out infinite;
}
@keyframes glowDisc{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.7}
  50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
}

.icon-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.ic{
  width:34px;height:34px;fill:none;
  stroke:#00ff64;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;
  animation:iconGlow 2.8s ease-in-out infinite, iconFlicker 5s ease-in-out 1s infinite;
}
@keyframes iconGlow{
  0%,100%{filter:drop-shadow(0 0 5px rgba(0,255,100,0.6));opacity:0.88}
  50%{filter:drop-shadow(0 0 14px rgba(0,255,100,1)) drop-shadow(0 0 24px rgba(0,255,100,0.5));opacity:1}
}
@keyframes iconFlicker{
  0%,100%{opacity:1}30%{opacity:0.7}32%{opacity:1}65%{opacity:0.65}67%{opacity:1}
}

/* ── GLITCH TITLE (upgraded) ── */
.title{
  font-size:26px;font-weight:800;letter-spacing:-0.3px;
  color:#00ff64;min-height:34px;margin-bottom:10px;
  text-shadow:0 0 20px rgba(0,255,100,0.45),0 0 40px rgba(0,255,100,0.15);
  opacity:0;animation:slideUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.45s forwards;
  position:relative;
}
.title.glitch-on{
  animation:slideUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.45s forwards,
             glitch 3.5s ease-in-out 1.5s infinite;
}
@keyframes glitch{
  0%,78%,100%{
    text-shadow:0 0 20px rgba(0,255,100,0.45),0 0 40px rgba(0,255,100,0.15);
    transform:translate(0);clip-path:none;
  }
  80%{
    text-shadow:-4px 0 rgba(0,210,255,0.9),4px 0 rgba(255,0,100,0.8),0 0 20px rgba(0,255,100,0.3);
    transform:translate(-3px,0) skewX(-2deg);
  }
  81%{
    text-shadow:4px 0 rgba(0,210,255,0.9),-4px 0 rgba(255,0,100,0.8);
    transform:translate(3px,0) skewX(2deg);
  }
  82%{
    text-shadow:-2px 0 rgba(0,210,255,0.6),2px 0 rgba(255,0,100,0.5);
    transform:translate(-1px,0);
  }
  83%{
    text-shadow:0 0 20px rgba(0,255,100,0.45);
    transform:translate(0);
  }
  86%{
    text-shadow:-5px 0 rgba(0,210,255,1),5px 0 rgba(255,0,100,1),0 0 0 rgba(0,255,100,0);
    transform:translate(-4px,1px) skewX(-4deg);
    filter:brightness(1.5);
  }
  87%{
    text-shadow:5px 0 rgba(0,210,255,1),-5px 0 rgba(255,0,100,1);
    transform:translate(4px,-1px) skewX(4deg);
    filter:brightness(1.5);
  }
  88%{
    text-shadow:0 0 20px rgba(0,255,100,0.45);
    transform:translate(0);
    filter:brightness(1);
  }
  90%{
    text-shadow:-3px 0 rgba(0,210,255,0.7),3px 0 rgba(255,0,100,0.6);
    transform:translate(-2px,0);
  }
  91%{
    text-shadow:0 0 20px rgba(0,255,100,0.45);
    transform:translate(0);
  }
}

/* Glitch pseudo bars */
.title.glitch-on::before,
.title.glitch-on::after{
  content:attr(data-text);
  position:absolute;top:0;left:0;width:100%;height:100%;
  color:#00ff64;
}
.title.glitch-on::before{
  animation:glitchTop 3.5s ease-in-out 1.5s infinite;
  clip-path:polygon(0 0,100% 0,100% 35%,0 35%);
  left:-2px;
}
.title.glitch-on::after{
  animation:glitchBot 3.5s ease-in-out 1.5s infinite;
  clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%);
  left:2px;
}
@keyframes glitchTop{
  0%,79%,84%,100%{transform:translate(0);opacity:0;}
  80%{transform:translate(-4px,0);opacity:1;filter:hue-rotate(180deg);}
  81%{transform:translate(4px,0);opacity:1;filter:hue-rotate(90deg);}
  82%{transform:translate(-2px,0);opacity:0.7;}
  83%{transform:translate(0);opacity:0;}
  85%{transform:translate(-6px,0);opacity:1;filter:hue-rotate(270deg);}
  86%{transform:translate(6px,0);opacity:1;}
  87%{transform:translate(0);opacity:0;}
}
@keyframes glitchBot{
  0%,79%,84%,100%{transform:translate(0);opacity:0;}
  80%{transform:translate(4px,0);opacity:1;filter:hue-rotate(90deg);}
  81%{transform:translate(-4px,0);opacity:1;filter:hue-rotate(180deg);}
  82%{transform:translate(2px,0);opacity:0.7;}
  83%{transform:translate(0);opacity:0;}
  85%{transform:translate(6px,0);opacity:1;filter:hue-rotate(270deg);}
  86%{transform:translate(-6px,0);opacity:1;}
  87%{transform:translate(0);opacity:0;}
}

.subtitle{
  font-size:13px;color:rgba(255,255,255,0.27);
  line-height:1.95;font-weight:400;margin-bottom:28px;
  opacity:0;animation:slideUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.58s forwards;
}
.divider{
  width:48px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,255,100,0.3),transparent);
  margin-bottom:26px;
  opacity:0;animation:fadeIn 0.5s ease 0.68s forwards;
}
@keyframes fadeIn{to{opacity:1}}

.btn-wrap{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%;
  opacity:0;animation:slideUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.76s forwards;
}
.btn{
  flex:1;min-width:120px;max-width:160px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;font-size:13px;font-weight:700;
  padding:12px 20px;border-radius:12px;
  cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#041f0c,#07361a);
  border:1px solid rgba(0,255,100,0.22);
  color:rgba(0,255,100,0.9);
  box-shadow:0 4px 16px rgba(0,255,100,0.08),inset 0 1px 0 rgba(0,255,100,0.06);
  transition:transform 0.3s cubic-bezier(0.16,1,0.3,1),box-shadow 0.3s ease,border-color 0.3s ease;
}
.btn::before{
  content:'';position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(135deg,rgba(0,255,100,0.06),transparent);
  opacity:0;transition:opacity 0.3s ease;
}
.btn::after{
  content:'';position:absolute;
  top:0;left:-110%;width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(0,255,100,0.1),transparent);
  animation:shimmer 4.5s ease-in-out 2s infinite;
}
@keyframes shimmer{0%,100%{left:-110%}45%,55%{left:210%}}
.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 26px rgba(0,255,100,0.18);border-color:rgba(0,255,100,0.4);}
.btn:hover::before{opacity:1}
.btn:active{transform:translateY(1px) scale(0.98);transition-duration:0.08s}

.ripple{
  position:absolute;border-radius:50%;
  background:rgba(0,255,100,0.15);
  transform:scale(0);
  animation:rippleOut 0.6s cubic-bezier(0.16,1,0.3,1);
  pointer-events:none;
}
@keyframes rippleOut{to{transform:scale(4.5);opacity:0}}

.footer{
  margin-top:24px;font-size:9px;font-weight:700;
  color:rgba(0,255,100,0.18);letter-spacing:3.5px;
  font-family:'Courier New',monospace;
  padding-top:14px;border-top:1px solid rgba(0,255,100,0.05);
  width:100%;
  opacity:0;animation:fadeIn 0.5s ease 0.92s forwards;
}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="ambient"></div>
<canvas id="particles"></canvas>

<div class="wrap">
  <div class="ring-wrap">
    <div class="pr pr3"></div>
    <div class="pr pr2"></div>
    <div class="pr pr1"></div>
    <div class="arc arc4"></div>
    <div class="arc arc3"></div>
    <div class="arc arc2"></div>
    <div class="arc arc1"></div>
    <div class="arc-dash"></div>
    <div class="glow-disc"></div>
    <div class="icon-wrap" id="iconWrap"></div>
  </div>

  <div class="title" id="title"></div>
  <div class="subtitle" id="subtitle"></div>
  <div class="divider"></div>

  <div class="btn-wrap">
    <a class="btn" href="https://t.me/freefilebd" target="_blank">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
      Telegram
    </a>
    <a class="btn" href="https://youtube.com/@zolamff" target="_blank">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      YouTube
    </a>
  </div>

  <div class="footer">— PROTECTED BY ZOLAM AUTH —</div>
</div>

<script>


// ── Particles (delta-time stable) ──
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let W,H,particles=[];

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',()=>{resize();initParticles();});

function initParticles(){
  particles=[];
  const count=Math.floor((W*H)/14000);
  for(let i=0;i<count;i++){
    particles.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:Math.random()*1.5+0.5,
      vx:(Math.random()-0.5)*0.06,   // px per ms
      vy:-(Math.random()*0.08+0.02), // always upward
      alpha:Math.random()*0.38+0.07,
      phase:Math.random()*Math.PI*2,
      phaseSpeed:Math.random()*0.0025+0.001, // rad per ms
    });
  }
}
initParticles();

let lastTs=0;
function drawParticles(ts){
  const dt=Math.min(ts-lastTs,50); // cap at 50ms so tab-switch doesn't jump
  lastTs=ts;
  ctx.clearRect(0,0,W,H);
  for(const p of particles){
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.phase+=p.phaseSpeed*dt;
    const a=p.alpha*(0.45+0.55*Math.sin(p.phase));
    if(p.y<-4)p.y=H+4;
    if(p.x<-4)p.x=W+4;
    if(p.x>W+4)p.x=-4;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,255,100,${a.toFixed(3)})`;
    ctx.fill();
  }
  requestAnimationFrame(drawParticles);
}
requestAnimationFrame(drawParticles);

// ── Auth state ──
const params=new URLSearchParams(window.location.search);
const s=params.get('s')||'expired';

const iconSVGs={
  wifi:`<svg class="ic" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>`,
  update:`<svg class="ic" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  lock:`<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
  key:`<svg class="ic" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>`,
  x:`<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
};

const cfg={
  offline:     {icon:'wifi',  title:'Server Offline',  sub:'The server is currently offline.<br>Please try again later.'},
  network:     {icon:'wifi',  title:'Network Error',   sub:'Please check your internet<br>connection and try again.'},
  tokenexpired:{icon:'update',title:'Update Required', sub:'Server requires a bypass update.<br>Contact your admin to proceed.'},
  expired:     {icon:'lock',  title:'Access Expired',  sub:'Your access has expired.<br>Please contact admin to renew.'},
  notfound:    {icon:'key',   title:'Not Registered',  sub:'Your device is not registered.<br>Contact admin to get access.'},
  error:       {icon:'x',     title:'Auth Failed',     sub:'Failed to verify your device.<br>Please restart the game.'},
};

const c=cfg[s]||cfg.error;
document.getElementById('iconWrap').innerHTML=iconSVGs[c.icon];
document.getElementById('subtitle').innerHTML=c.sub;

const titleEl=document.getElementById('title');
titleEl.setAttribute('data-text','');
setTimeout(()=>{
  let i=0;
  const type=()=>{
    if(i<c.title.length){
      titleEl.textContent+=c.title[i++];
      titleEl.setAttribute('data-text',titleEl.textContent);
      setTimeout(type,52);
    } else {
      titleEl.classList.add('glitch-on');
    }
  };
  type();
},480);

document.querySelectorAll('.btn').forEach(btn=>{
  btn.addEventListener('click',function(e){
    const r=document.createElement('span');
    r.className='ripple';
    const rect=this.getBoundingClientRect();
    const size=Math.max(rect.width,rect.height);
    r.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
    this.appendChild(r);
    setTimeout(()=>r.remove(),620);
  });
});
</script>
</body>
</html>
